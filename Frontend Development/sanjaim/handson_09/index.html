<!doctype html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./styles.css">
        <title>Student Portal</title>
        <script src="https://cdn.jsdelivr.net/npm/css-vars-ponyfill@2"></script>
        <script>
            window.addEventListener('DOMContentLoaded', function () {
                cssVars({ watch: true })
            })
        </script>
    </head>
    <body>
        <header>
            <h1>Student Portal</h1>
            <button type="button" class="hamburger" aria-expanded="false" aria-controls="primary-nav"> = Menu </button>
            <nav aria-label="Main navigation">
                <ul id="primary-nav">
                    <li><a href="#hero" aria-current="page">Home</a></li>
                    <li><a href="#course">Courses</a></li>
                    <li><a href="#profile">Profile</a></li>
                    <li><a href="#grades">Grades</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section id="hero">
                <h2>Welcome to the Student Portal</h2>
                <p>This is the Student portal</p>
                <button type="button">Explore Courses</button>
            </section>

            <section id="course">
                <h2>Courses</h2>
                <div class="search-bar">
                    <label for="search-courses">Search courses</label>
                    <input type="search" id="search-courses" placeholder="Search by name">
                </div>
                <p id="course-count" role="status" aria-live="polite"></p>
                <div class="course-grid"></div>
                <p id="selected-course" role="status" aria-live="polite"></p>
            </section>

            <section class="stats-bar">
                <div class="stat-item">
                    <h3>3</h3>
                    <p>Courses Enrolled</p>
                </div>
                <div class="stat-item">
                    <h3>3.8</h3>
                    <p>GPA</p>
                </div>
                <div class="stat-item">
                    <h3>6</h3>
                    <p>Semester</p>
                </div>
            </section>

            <section id="profile">
                <h2>Student Profile</h2>
                <form id="profile-form" novalidate>
                    <div class="form-field">
                        <label for="profile-name">Name</label>
                        <input type="text" id="profile-name" name="name">
                    </div>
                    <div class="form-field">
                        <label for="profile-email">Email</label>
                        <input type="email" id="profile-email" name="email">
                    </div>
                    <div class="form-field">
                        <label for="profile-semester">Semester</label>
                        <input type="text" id="profile-semester" name="semester">
                    </div>
                    <button type="submit">Save</button>
                </form>
            </section>

            <section id="grades">
                <h2>Grades</h2>
                <table>
                    <caption>Grades by enrolled course</caption>
                    <thead>
                        <tr>
                            <th scope="col">Course</th>
                            <th scope="col">Code</th>
                            <th scope="col">Grade</th>
                        </tr>
                    </thead>
                    <tbody id="grades-body"></tbody>
                </table>
            </section>
        </main>
        <footer>
            <p>Student Portal</p>
        </footer>
        <script type="module" src="./js/app.js"></script>
    </body>
</html>
